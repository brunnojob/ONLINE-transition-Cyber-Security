<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transaction Guard Evidence</title><style>body{max-width:900px;margin:70px auto;padding:0 24px;background:#0b1019;color:#dce8f6;font:17px/1.6 system-ui}h1{font-size:42px}a{color:#82d7ce}pre{white-space:pre-wrap;padding:24px;background:#162132;border:1px solid #324862;border-radius:12px}strong{color:#82d7ce}</style><h1>Transaction Guard</h1><p>Reproducible evidence for transaction authorization and local dispatch protection.</p><p><strong>Evidence scope:</strong> isolated test transactions. No bank settlement is connected.</p><pre id="proof">Loading recorded evidence…</pre><p><a href="https://github.com/brunnojob/ONLINE-transition-Cyber-Security">Source and reproduction instructions</a> · <a href="https://brunnodev.store">brunnodev</a></p><script>fetch('proof.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Evidence unavailable');return r.json()}).then(p=>{document.getElementById('proof').textContent=JSON.stringify(p,null,2)}).catch(e=>{document.getElementById('proof').textContent=e.message})</script></html>
